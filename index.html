<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=0, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VolleyScore" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>VolleyScore</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&family=Chakra+Petch:wght@600;700&family=Concert+One&family=Kosugi+Maru&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="shortcut icon" href="/scoreCalc-icon.svg" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="128x128" href="/scoreCalc.png" />

    <meta name="theme-color" content="#485696" />
    <style>
      html, body { margin: 0; background: linear-gradient(to bottom, #485696 0%, #2e3a6e 55%, #1a2347 100%); height: 100%; }
      #root { height: 100%; }
      #splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
      #splash h1 { margin: 0; font-family: 'Chakra Petch', 'Barlow Condensed', sans-serif; font-size: clamp(3rem, 7vw, 5rem); font-weight: 700; color: #f9c784; letter-spacing: 4px; }
      #splash-credit { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 0.6rem; opacity: 0.3; color: #e7e7e7; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash"><h1>VolleyScore</h1><span id="splash-credit">© CM</span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
